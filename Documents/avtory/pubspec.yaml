name: avtory
description: AVTORY - Yo'l Yordami Platformasi. Yordam bir necha daqiqada.
publish_to: 'none'
version: 1.0.0+15

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.2.0

  # HTTP & API
  dio: ^5.4.0

  # Local storage
  shared_preferences: ^2.2.2

  # Maps (cross-platform — works on web, macOS, iOS, Android)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UI Components
  pinput: ^5.0.0
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Network
  connectivity_plus: ^6.0.3

  # Biometrics / Passkey
  local_auth: ^2.3.0

  # Secure token storage (Android Keystore / iOS Keychain)
  flutter_secure_storage: ^9.2.2

  # Geolocation
  geolocator: ^13.0.0

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.0
  flutter_local_notifications: ^17.2.3
  image_picker: ^1.1.2

  # Push notifications (FCM)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

# App launcher icon (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/avtory_icon.png"
  adaptive_icon_background: "assets/icon/avtory_bg.png"
  adaptive_icon_foreground: "assets/icon/avtory_fg.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
